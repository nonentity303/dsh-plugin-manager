<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="DSH 引擎船坞 drydock：白鲸喷着水花游向右方">
  <!-- 双色规范：仅 #3D5AFE（DSH 蓝）与 #FFFFFF（白），眼与嘴线用蓝底镂空 -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="#3D5AFE"/>
  <!-- 喷水 -->
  <circle cx="42" cy="17.5" r="1.7" fill="#FFFFFF"/>
  <circle cx="37.5" cy="14.8" r="1.2" fill="#FFFFFF"/>
  <circle cx="46.5" cy="14.8" r="1.2" fill="#FFFFFF"/>
  <!-- 双叶尾鳍（凹腰 fluke） -->
  <path d="M14.5 35 L6.5 27 C8.8 30.6 9.7 32.9 9.7 35 C9.7 37.1 8.8 39.4 6.5 43 Z" fill="#FFFFFF"/>
  <!-- 鲸鱼身体 -->
  <path d="M11 35 C11.5 30.5 16 27 22.5 26.6 C27 26.3 30.5 25 36 24.6 C44 24 51 26.5 54 31 C55.5 33.5 55.5 36.5 54 39 C51.5 42.8 47 44.5 41.5 44.5 L21 44.5 C15 44.5 11.5 40.5 11 35 Z" fill="#FFFFFF"/>
  <!-- 眼（蓝底镂空） -->
  <circle cx="47.5" cy="32.5" r="2" fill="#3D5AFE"/>
  <!-- 嘴线（蓝底镂空） -->
  <path d="M54.5 36.6 C50.5 39.6 46 40.8 41 40.8" fill="none" stroke="#3D5AFE" stroke-width="1.6" stroke-linecap="round"/>
</svg>
